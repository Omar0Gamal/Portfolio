<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="100%" stop-color="#0D1220"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="node-glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node-glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="blur-md">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="blur-xl">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="820" cy="260" rx="280" ry="180" fill="#00D4FF" opacity="0.035" filter="url(#blur-xl)"/>
  <ellipse cx="820" cy="260" rx="120" ry="80" fill="#7C3AED" opacity="0.06" filter="url(#blur-xl)"/>

  <!-- ═══════════════════════════════════════════
       DIAGRAM: Saga Services in orbit around hub
  ═══════════════════════════════════════════ -->

  <!-- Hub: Orchestrator -->
  <!-- Glow rings behind hub -->
  <circle cx="820" cy="260" r="90" fill="url(#center-glow)" filter="url(#blur-md)"/>
  <circle cx="820" cy="260" r="72" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.15" fill="none"/>
  <circle cx="820" cy="260" r="55" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.12" fill="none"/>

  <!-- Outer orbit ring -->
  <circle cx="820" cy="260" r="185" stroke="white" stroke-width="0.7" stroke-opacity="0.06" fill="none" stroke-dasharray="4 10"/>

  <!-- Connection lines from hub to each service  -->
  <!-- Go Orchestrator (top) -->
  <line x1="820" y1="215" x2="820" y2="85" stroke="#00D4FF" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- C# Billing (upper right) -->
  <line x1="858" y1="230" x2="981" y2="130" stroke="#00D4FF" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- Python Notifier (lower right) -->
  <line x1="862" y1="285" x2="978" y2="388" stroke="#7C3AED" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- NATS (bottom) -->
  <line x1="820" y1="305" x2="820" y2="435" stroke="#7C3AED" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- k8s (lower left) -->
  <line x1="780" y1="285" x2="662" y2="388" stroke="#7C3AED" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- gRPC (upper left) -->
  <line x1="778" y1="230" x2="659" y2="130" stroke="#00D4FF" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Data packet dots travelling lines (decorative) -->
  <circle cx="820" cy="158" r="3" fill="#00D4FF" opacity="0.7"/>
  <circle cx="916" cy="168" r="3" fill="#00D4FF" opacity="0.6"/>
  <circle cx="924" cy="332" r="3" fill="#7C3AED" opacity="0.7"/>
  <circle cx="820" cy="378" r="3" fill="#7C3AED" opacity="0.6"/>
  <circle cx="716" cy="332" r="3" fill="#7C3AED" opacity="0.5"/>
  <circle cx="724" cy="168" r="3" fill="#00D4FF" opacity="0.7"/>

  <!-- Hub body -->
  <circle cx="820" cy="260" r="48" fill="#0E1828" stroke="#00D4FF" stroke-width="2.5"/>
  <!-- Hub icon: orchestrator arrows -->
  <path d="M806 252 L820 244 L834 252" stroke="#00D4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M806 268 L820 276 L834 268" stroke="#00D4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="820" y1="244" x2="820" y2="276" stroke="#00D4FF" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Service Nodes -->
  <!-- Go Orchestrator — top -->
  <circle cx="820" cy="75" r="26" fill="#0E1828" opacity="0.5" filter="url(#blur-sm)"/>
  <circle cx="820" cy="75" r="26" fill="#0B1622" stroke="#00D4FF" stroke-width="2"/>
  <text x="820" y="71" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#00D4FF" font-weight="600">Go</text>
  <text x="820" y="83" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#00D4FF" opacity="0.7">ORCH</text>

  <!-- C# Billing — upper right -->
  <circle cx="992" cy="120" r="26" fill="#0B1622" stroke="#00D4FF" stroke-width="2"/>
  <text x="992" y="116" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#00D4FF" font-weight="600">C#</text>
  <text x="992" y="128" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#00D4FF" opacity="0.7">BILLING</text>

  <!-- Python Notifier — lower right -->
  <circle cx="992" cy="398" r="26" fill="#0B1622" stroke="#7C3AED" stroke-width="2"/>
  <text x="992" y="394" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#7C3AED" font-weight="600">PY</text>
  <text x="992" y="406" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#7C3AED" opacity="0.7">NOTIFY</text>

  <!-- NATS JetStream — bottom -->
  <circle cx="820" cy="445" r="26" fill="#0B1622" stroke="#7C3AED" stroke-width="2"/>
  <text x="820" y="441" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#7C3AED" font-weight="600">NATS</text>
  <text x="820" y="453" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#7C3AED" opacity="0.7">QUEUE</text>

  <!-- Kubernetes — lower left -->
  <circle cx="648" cy="398" r="26" fill="#0B1622" stroke="#7C3AED" stroke-width="2"/>
  <text x="648" y="394" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#7C3AED" font-weight="600">K8s</text>
  <text x="648" y="406" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#7C3AED" opacity="0.7">DEPLOY</text>

  <!-- gRPC — upper left -->
  <circle cx="648" cy="120" r="26" fill="#0B1622" stroke="#00D4FF" stroke-width="2"/>
  <text x="648" y="116" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#00D4FF" font-weight="600">gRPC</text>
  <text x="648" y="128" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#00D4FF" opacity="0.7">PROTO</text>

  <!-- ═══════════════════════════════
       TEXT
  ═══════════════════════════════ -->

  <!-- Left-column text block -->
  <g transform="translate(56, 60)">
    <!-- Eyebrow label -->
    <rect x="0" y="0" width="130" height="24" rx="4" fill="#00D4FF" fill-opacity="0.1"/>
    <rect x="0" y="0" width="130" height="24" rx="4" stroke="#00D4FF" stroke-opacity="0.25" stroke-width="1" fill="none"/>
    <text x="65" y="16.5" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#00D4FF" letter-spacing="2" font-weight="600">OPEN SOURCE</text>

    <!-- Title -->
    <text x="0" y="70" font-family="ui-sans-serif,system-ui,sans-serif" font-size="52" font-weight="900" fill="white" letter-spacing="-1">Cartwright</text>

    <!-- Subtitle divider line -->
    <rect x="0" y="86" width="52" height="3" rx="2" fill="#00D4FF"/>

    <!-- Subtitle -->
    <text x="0" y="118" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="white" fill-opacity="0.55" letter-spacing="0.3">Saga-based Distributed Checkout</text>

    <!-- Description -->
    <text x="0" y="162" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" fill="white" fill-opacity="0.38">Multi-language microservices with</text>
    <text x="0" y="182" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" fill="white" fill-opacity="0.38">compensating transactions and chaos testing.</text>

    <!-- Pill tags -->
    <rect x="0" y="210" width="36" height="22" rx="5" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
    <text x="18" y="225.5" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="white" fill-opacity="0.7">Go</text>

    <rect x="46" y="210" width="46" height="22" rx="5" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
    <text x="69" y="225.5" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="white" fill-opacity="0.7">gRPC</text>

    <rect x="102" y="210" width="86" height="22" rx="5" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
    <text x="145" y="225.5" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="white" fill-opacity="0.7">NATS JetStream</text>

    <rect x="198" y="210" width="52" height="22" rx="5" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
    <text x="224" y="225.5" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="white" fill-opacity="0.7">Helm</text>

    <rect x="0" y="241" width="72" height="22" rx="5" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
    <text x="36" y="256.5" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="white" fill-opacity="0.7">Terraform</text>

    <rect x="82" y="241" width="64" height="22" rx="5" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
    <text x="114" y="256.5" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="white" fill-opacity="0.7">ASP.NET</text>
  </g>

  <!-- Bottom rule line -->
  <line x1="56" y1="590" x2="1144" y2="590" stroke="white" stroke-opacity="0.06" stroke-width="1"/>
  <text x="56" y="614" font-family="ui-monospace,monospace" font-size="11" fill="white" fill-opacity="0.2" letter-spacing="1">github.com/Omar0Gamal/cartwright</text>
</svg>
